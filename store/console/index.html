<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PMS Console — ProMarketingStore</title>
<meta name="description" content="ProMarketingStore console: create campaigns, chat with AI, manage content calendar, browse marketplace.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--text:#1a1a1a;--muted:#6b7280;--panel:#ffffff;--line:#e5e7eb;--accent:#f97316;--accent2:#ef4444;--grad:linear-gradient(135deg,#f97316,#ef4444);--sidebar:260px;--radius:10px}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:.85rem}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}

/* Sidebar */
.sidebar{width:var(--sidebar);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow-y:auto}
.sidebar-brand{padding:1.2rem 1rem .8rem;display:flex;align-items:center;gap:.5rem}
.brand-icon{width:32px;height:32px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.65rem;font-weight:800;flex-shrink:0}
.brand-title{font-size:1rem;font-weight:800}
.brand-tag{font-size:.5rem;font-weight:800;background:var(--grad);color:#fff;padding:.1rem .35rem;border-radius:3px;text-transform:uppercase;letter-spacing:.5px;margin-left:.2rem}
.sidebar-nav{flex:1;padding:.3rem .6rem}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:8px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:#f3f4f6;color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(249,115,22,.1),rgba(239,68,68,.08));color:var(--accent)}
.nav-item .icon{width:20px;text-align:center;font-size:.95rem}
.nav-sep{height:1px;background:var(--line);margin:.5rem .7rem}
.sidebar-footer{padding:.8rem 1rem;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}
.api-badge{display:flex;align-items:center;gap:.4rem;padding:.4rem .6rem;background:#f9fafb;border:1px solid var(--line);border-radius:6px;font-size:.72rem;cursor:pointer;transition:all .15s}
.api-badge:hover{border-color:var(--accent)}
.api-badge .dot{width:7px;height:7px;border-radius:50%;background:#d1d5db}
.api-badge .dot.on{background:#22c55e}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:.7rem 1.2rem;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h2{font-size:1rem;font-weight:700}
.topbar-actions{display:flex;gap:.5rem}
.btn{padding:.4rem .9rem;border-radius:7px;font-size:.78rem;font-weight:600;transition:all .15s}
.btn-primary{background:var(--grad);color:#fff}.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--panel);border:1px solid var(--line);color:var(--text)}.btn-secondary:hover{border-color:var(--accent)}
.btn-ghost{color:var(--muted);padding:.4rem .5rem}.btn-ghost:hover{color:var(--text)}
.content{flex:1;overflow-y:auto;padding:1.2rem}

/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;margin-bottom:.6rem;transition:all .15s}
.card:hover{border-color:#d1d5db;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.8rem}
.status-badge{display:inline-block;padding:.15rem .5rem;border-radius:99px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.status-draft{background:#f3f4f6;color:#6b7280}
.status-active{background:#dcfce7;color:#16a34a}
.status-completed{background:#dbeafe;color:#2563eb}
.status-scheduled{background:#fef3c7;color:#92400e}
.status-posted{background:#dcfce7;color:#16a34a}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--panel);border-radius:14px;padding:1.5rem;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:1rem;font-weight:700;margin-bottom:1rem}
.form-group{margin-bottom:.8rem}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:.5rem .7rem;border:1px solid var(--line);border-radius:7px;background:var(--bg);outline:none;transition:border-color .15s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:60px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:.5rem}
.checkbox-group label{display:flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:500;cursor:pointer;text-transform:none;letter-spacing:0}
.checkbox-group input[type="checkbox"]{accent-color:var(--accent)}
.form-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}

/* Chat */
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-messages{flex:1;overflow-y:auto;padding:1rem}
.chat-msg{margin-bottom:.8rem;max-width:80%;animation:fadeIn .2s}
.chat-msg.user{margin-left:auto}
.chat-msg.assistant{margin-right:auto}
.chat-bubble{padding:.6rem .9rem;border-radius:12px;font-size:.84rem;line-height:1.6}
.chat-msg.user .chat-bubble{background:var(--grad);color:#fff;border-bottom-right-radius:4px}
.chat-msg.assistant .chat-bubble{background:#f3f4f6;color:var(--text);border-bottom-left-radius:4px}
.chat-input-row{display:flex;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--line);background:var(--panel)}
.chat-input-row input{flex:1;padding:.55rem .8rem;border:1px solid var(--line);border-radius:8px;outline:none;font-size:.85rem}
.chat-input-row input:focus{border-color:var(--accent)}
.chat-send{background:var(--grad);color:#fff;border-radius:8px;padding:.5rem .9rem;font-weight:600;font-size:.82rem}
.chat-send:disabled{opacity:.5;cursor:not-allowed}
.chat-empty{text-align:center;color:var(--muted);padding:3rem 1rem;font-size:.88rem;line-height:1.7}
.preview-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin-top:.5rem;font-size:.8rem}
.preview-card .platform-tag{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:.3rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* Calendar */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.cal-header h3{font-size:.95rem;font-weight:700}
.cal-nav{display:flex;gap:.3rem}
.cal-nav button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:.85rem;display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-day-header{background:#f3f4f6;padding:.4rem;text-align:center;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal-day{background:var(--panel);min-height:80px;padding:.3rem;cursor:pointer;transition:background .1s;position:relative}
.cal-day:hover{background:#f9fafb}
.cal-day.other{opacity:.35}
.cal-day.today{background:rgba(249,115,22,.05)}
.cal-day-num{font-size:.72rem;font-weight:600;margin-bottom:.2rem}
.cal-dot{width:100%;padding:.1rem .25rem;border-radius:3px;font-size:.58rem;font-weight:600;color:#fff;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab}
.cal-dot[data-platform="x"]{background:#1d9bf0}
.cal-dot[data-platform="instagram"]{background:#e1306c}
.cal-dot[data-platform="linkedin"]{background:#0a66c2}
.cal-dot[data-platform="email"]{background:#16a34a}
.cal-dot[data-platform="tiktok"]{background:#1a1a1a}

/* Post task board */
.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:.8rem}
.board-summary{font-size:.78rem;color:var(--muted)}
.board-actions{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.board-actions select{padding:.38rem .55rem;border:1px solid var(--line);border-radius:7px;background:var(--panel);outline:none}
.kanban-board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:.65rem;align-items:start;overflow-x:auto;padding-bottom:.5rem}
.kanban-column{border:1px solid var(--line);border-radius:8px;background:#f9fafb;min-height:260px;min-width:210px}
.kanban-header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.65rem .7rem;border-bottom:1px solid var(--line);background:var(--panel);border-radius:8px 8px 0 0}
.kanban-title{display:flex;align-items:center;gap:.42rem;font-size:.78rem;font-weight:800}
.kanban-dot{width:.52rem;height:.52rem;border-radius:999px;background:var(--muted);flex-shrink:0}
.kanban-count{font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.08rem .42rem}
.kanban-items{display:flex;flex-direction:column;gap:.5rem;padding:.6rem;min-height:210px}
.kanban-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.7rem;cursor:grab;transition:border-color .15s,box-shadow .15s,transform .15s}
.kanban-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.05);transform:translateY(-1px)}
.kanban-card.dragging{opacity:.55}
.kanban-card-title{font-size:.8rem;font-weight:700;line-height:1.35;margin-bottom:.35rem;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kanban-card-meta{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;font-size:.68rem;color:var(--muted);margin-bottom:.45rem}
.kanban-pill{display:inline-flex;align-items:center;padding:.12rem .42rem;border-radius:999px;background:#f3f4f6;font-weight:700;color:var(--muted)}
.kanban-platform{color:#fff;text-transform:uppercase;letter-spacing:.2px}
.kanban-card-actions{display:flex;gap:.3rem;flex-wrap:wrap}
.kanban-card-actions button{font-size:.68rem;padding:.24rem .45rem;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--muted);font-weight:700}
.kanban-card-actions button:hover{border-color:var(--accent);color:var(--accent)}
.kanban-empty{padding:.7rem;color:var(--muted);font-size:.76rem;line-height:1.45}
.board-drop-active{outline:2px dashed rgba(249,115,22,.35);outline-offset:-6px}

/* Content library */
.content-filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.filter-btn{padding:.3rem .7rem;border-radius:6px;font-size:.73rem;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--muted);transition:all .15s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(249,115,22,.05)}
.content-item{display:flex;align-items:flex-start;gap:.8rem;padding:.8rem}
.content-type-tag{font-size:.62rem;font-weight:700;padding:.15rem .4rem;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0;background:#f3f4f6;color:var(--muted)}
.content-body{flex:1;min-width:0}
.content-body p{font-size:.82rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.content-meta{display:flex;gap:.5rem;align-items:center;margin-top:.3rem;font-size:.7rem;color:var(--muted)}
.content-actions{display:flex;gap:.3rem;flex-shrink:0}
.content-actions button{font-size:.72rem;padding:.25rem .5rem;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.content-actions button:hover{border-color:var(--accent);color:var(--accent)}

/* Marketplace */
.mp-filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.mp-card{display:flex;align-items:center;gap:.8rem;padding:.9rem}
.mp-avatar{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0}
.mp-info{flex:1;min-width:0}
.mp-info h4{font-size:.85rem;font-weight:700}
.mp-info .mp-spec{font-size:.75rem;color:var(--muted)}
.mp-stats{display:flex;gap:.8rem;margin-top:.2rem;font-size:.72rem;color:var(--muted)}
.mp-stats span{display:flex;align-items:center;gap:.2rem}

/* Analytics */
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem;margin-bottom:1rem}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;text-align:center}
.stat-card .stat-val{font-size:1.6rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-card .stat-label{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:.2rem}
.stat-card .stat-trend{font-size:.7rem;margin-top:.3rem}
.stat-card .stat-trend.up{color:#16a34a}
.stat-card .stat-trend.down{color:#ef4444}
.chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
.chart-wrap h4{font-size:.82rem;font-weight:700;margin-bottom:.6rem}
canvas{width:100%;height:200px}

/* Settings */
.settings-section{margin-bottom:1.5rem}
.settings-section h4{font-size:.85rem;font-weight:700;margin-bottom:.6rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0}
.setting-row label{font-size:.82rem;font-weight:500}
.setting-row input[type="text"],.setting-row input[type="password"]{width:280px;padding:.4rem .6rem;border:1px solid var(--line);border-radius:6px;outline:none;font-size:.82rem}
.setting-row input:focus{border-color:var(--accent)}
.toggle{width:36px;height:20px;border-radius:10px;background:#d1d5db;position:relative;cursor:pointer;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle.on::after{transform:translateX(16px)}
.danger-btn{background:#fef2f2;color:#ef4444;border:1px solid #fecaca;border-radius:7px;padding:.4rem .9rem;font-size:.78rem;font-weight:600}
.danger-btn:hover{background:#fee2e2}

/* Search */
.search-bar{position:relative;margin-bottom:.8rem}
.search-bar input{width:100%;padding:.5rem .7rem .5rem 2rem;border:1px solid var(--line);border-radius:8px;background:var(--panel);outline:none;font-size:.82rem}
.search-bar input:focus{border-color:var(--accent)}
.search-bar::before{content:'\1F50D';position:absolute;left:.6rem;top:50%;transform:translateY(-50%);font-size:.75rem;opacity:.4}

/* Empty state */
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty .empty-icon{font-size:2rem;margin-bottom:.5rem;opacity:.4}
.empty p{font-size:.85rem;margin-bottom:.8rem}

/* Day detail panel */
.day-detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;margin-top:.8rem}
.day-detail h4{font-size:.85rem;font-weight:700;margin-bottom:.5rem}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:calc(-1 * var(--sidebar));z-index:50;transition:left .2s;box-shadow:2px 0 20px rgba(0,0,0,.1)}
  .sidebar.open{left:0}
  .menu-toggle{display:flex!important}
  .card-grid{grid-template-columns:1fr}
  .analytics-grid{grid-template-columns:repeat(2,1fr)}
  .chat-msg{max-width:90%}
}
.menu-toggle{display:none;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:.9rem}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">PMS</div>
    <span class="brand-title">Pro</span>
    <span class="brand-tag">Console</span>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <div class="nav-item active" data-view="dashboard"><span class="icon">&#127968;</span>Dashboard</div>
    <div class="nav-item" data-view="contentSources"><span class="icon">&#128225;</span>Sources</div>
    <div class="nav-item" data-view="compose"><span class="icon">&#9998;</span>Compose</div>
    <div class="nav-item" data-view="postHistory"><span class="icon">&#128203;</span>Post History</div>
    <div class="nav-item" data-view="postCalendar"><span class="icon">&#128197;</span>Calendar</div>
    <div class="nav-item" data-view="connections"><span class="icon">&#128279;</span>Connections</div>
    <div class="nav-item" data-view="brandVoice"><span class="icon">&#127908;</span>Brand Voice</div>
    <div class="nav-sep"></div>
    <div class="nav-item" data-view="campaigns"><span class="icon">&#9776;</span>Campaigns</div>
    <div class="nav-item" data-view="board"><span class="icon">&#9638;</span>Post Board</div>
    <div class="nav-item" data-view="agent"><span class="icon">&#128172;</span>Agent Chat</div>
    <div class="nav-item" data-view="calendar"><span class="icon">&#128197;</span>Calendar</div>
    <div class="nav-item" data-view="content"><span class="icon">&#128196;</span>Content Library</div>
    <div class="nav-sep"></div>
    <div class="nav-item" data-view="marketplace"><span class="icon">&#127970;</span>Marketplace</div>
    <div class="nav-item" data-view="analytics"><span class="icon">&#128200;</span>Analytics</div>
    <div class="nav-sep"></div>
    <div class="nav-item" data-view="settings"><span class="icon">&#9881;</span>Settings</div>
  </nav>
  <div class="sidebar-footer">
    <div class="api-badge" onclick="switchView('settings')" title="Click to configure API key">
      <span class="dot" id="apiDot"></span>
      <span id="apiLabel">API Key: not set</span>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:.5rem">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <h2 id="viewTitle">Campaigns</h2>
    </div>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>
  <div class="content" id="viewContent"></div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ── State ── */
const LS = k => JSON.parse(localStorage.getItem('pms_' + k) || 'null');
const SS = (k, v) => localStorage.setItem('pms_' + k, JSON.stringify(v));

function getCampaigns() { return LS('campaigns') || []; }
function saveCampaigns(c) { SS('campaigns', c); }
function getContent() { return LS('content') || []; }
function saveContent(c) { SS('content', c); }
function getChatHistory(id) { return LS('chat_' + id) || []; }
function saveChatHistory(id, h) { SS('chat_' + id, h); }
function getCalendarPosts() { return LS('cal_posts') || []; }
function saveCalendarPosts(p) { SS('cal_posts', p); }
function getApiKey() { return localStorage.getItem('pms_apikey') || ''; }
function setApiKey(k) { localStorage.setItem('pms_apikey', k); updateApiBadge(); }

function updateApiBadge() {
  const k = getApiKey();
  document.getElementById('apiDot').className = 'dot' + (k ? ' on' : '');
  document.getElementById('apiLabel').textContent = k ? 'API Key: ' + '\u2022'.repeat(8) : 'API Key: not set';
}

/* ── View Router ── */
let currentView = 'campaigns';
let currentCampaignId = null;
let calMonth, calYear;

function switchView(view, opts) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
  document.getElementById('sidebar').classList.remove('open');
  const titles = { campaigns: 'Campaigns', board: 'Post Board', agent: 'AI Agent Chat', calendar: 'Content Calendar', content: 'Content Library', marketplace: 'Marketplace', analytics: 'Analytics', settings: 'Settings', campaignDetail: 'Campaign Detail' };
  document.getElementById('viewTitle').textContent = titles[view] || 'Console';
  document.getElementById('topbarActions').innerHTML = '';

  const r = { dashboard: renderDashboard, contentSources: renderContentSources, compose: renderCompose, postHistory: renderPostHistory, postCalendar: renderPostCalendar, connections: renderConnections, brandVoice: renderBrandVoice, campaigns: renderCampaigns, board: renderPostBoard, agent: renderAgent, calendar: renderCalendar, content: renderContent, marketplace: renderMarketplace, analytics: renderAnalytics, settings: renderSettings, campaignDetail: renderCampaignDetail };
  if (r[view]) r[view](opts);
}

document.getElementById('sidebarNav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (item && item.dataset.view) switchView(item.dataset.view);
});

/* ── Campaigns View ── */
function renderCampaigns() {
  const tb = document.getElementById('topbarActions');
  tb.innerHTML = '<button class="btn btn-primary" onclick="openNewCampaignModal()">+ New Campaign</button>';
  const camps = getCampaigns();
  const el = document.getElementById('viewContent');

  const channels = [...document.querySelectorAll('.checkbox-group input:checked')].map(c => c.value);

  const camps = getCampaigns();
  camps.unshift(camp);
  saveCampaigns(camps);
  closeModal();
  switchView('campaigns');

function openCampaign(id) {

function updateCampaignStatus(id, status) {

/* ── Post Task Board ── */
const boardColumns = [
  { id: 'draft', label: 'Draft', color: '#6b7280' },
  { id: 'needs_approval', label: 'Needs Approval', color: '#f59e0b' },
  { id: 'approved', label: 'Approved', color: '#0ea5e9' },
  { id: 'scheduled', label: 'Scheduled', color: '#8b5cf6' },
  { id: 'published', label: 'Published', color: '#16a34a' },
  { id: 'failed', label: 'Blocked', color: '#ef4444' }
];
let boardCampaignFilter = 'all';
let boardDragKey = null;

function normalizeBoardStatus(status) {
  const s = String(status || 'Draft').toLowerCase().replace(/[\s-]+/g, '_');
  if (['pending', 'needs_approval', 'review'].includes(s)) return 'needs_approval';
  if (['approved', 'ready'].includes(s)) return 'approved';
  if (['scheduled', 'queued'].includes(s)) return 'scheduled';
  if (['publishing', 'running'].includes(s)) return 'scheduled';
  if (['published', 'posted', 'complete', 'completed'].includes(s)) return 'published';
  if (['failed', 'blocked', 'cancelled', 'canceled'].includes(s)) return 'failed';
  return 'draft';
}

function boardStatusLabel(status) {
  const col = boardColumns.find(c => c.id === normalizeBoardStatus(status));
  return col ? col.label : 'Draft';
}

function boardPlatformColor(platform) {
  const key = String(platform || '').toLowerCase();
  return { x: '#1d9bf0', twitter: '#1d9bf0', instagram: '#e1306c', linkedin: '#0a66c2', email: '#16a34a', tiktok: '#111827', facebook: '#1877f2', social: '#6b7280' }[key] || '#6b7280';
}

function getPostTasks() {
  const campaigns = getCampaigns();
  const campaignName = id => campaigns.find(c => c.id === id)?.name || 'No campaign';
  const scheduled = getCalendarPosts().map(p => ({
    key: 'calendar:' + p.id,
    source: 'calendar',
    id: p.id,
    campaignId: p.campaignId || null,
    campaign: campaignName(p.campaignId),
    platform: p.platform || 'social',
    text: p.text || '',
    date: p.date || null,
    status: normalizeBoardStatus(p.status || 'Scheduled')
  }));
  const drafts = getContent()
    .filter(c => c.type === 'Social Post')
    .map(c => ({
      key: 'content:' + c.id,
      source: 'content',
      id: c.id,
      campaignId: c.campaignId || null,
      campaign: c.campaign || campaignName(c.campaignId),
      platform: c.platform || 'social',
      text: c.text || '',
      date: null,
      status: normalizeBoardStatus(c.status || 'Draft')
    }));
  return scheduled.concat(drafts);
}

function renderPostBoard() {
  const el = document.getElementById('viewContent');
  const tb = document.getElementById('topbarActions');
  tb.innerHTML = '<button class="btn btn-primary" onclick="openAddPostModal()">+ Add Post</button>';
  const campaigns = getCampaigns();
  const allTasks = getPostTasks();
  const tasks = boardCampaignFilter === 'all' ? allTasks : allTasks.filter(t => t.campaignId === boardCampaignFilter);
  const scheduledCount = tasks.filter(t => t.status === 'scheduled').length;
  const approvalCount = tasks.filter(t => t.status === 'needs_approval').length;

  el.innerHTML = `
    <div class="board-toolbar">
      <div class="board-summary">${tasks.length} post tasks &middot; ${approvalCount} need approval &middot; ${scheduledCount} scheduled</div>
      <div class="board-actions">
        <select onchange="boardCampaignFilter=this.value;renderPostBoard()">
          <option value="all">All campaigns</option>
          ${campaigns.map(c => `<option value="${c.id}" ${boardCampaignFilter === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select>
        <button class="btn btn-secondary" onclick="seedBoardFromContent()">Create tasks from social drafts</button>
      </div>
    </div>
    <div class="kanban-board">
      ${boardColumns.map(col => {
        const colTasks = tasks.filter(t => t.status === col.id);
        return `
          <section class="kanban-column" data-status="${col.id}" ondragover="event.preventDefault();this.classList.add('board-drop-active')" ondragleave="this.classList.remove('board-drop-active')" ondrop="dropBoardTask(event,'${col.id}',this)">
            <div class="kanban-header">
              <div class="kanban-title"><span class="kanban-dot" style="background:${col.color}"></span>${col.label}</div>
              <span class="kanban-count">${colTasks.length}</span>
            </div>
            <div class="kanban-items">
              ${colTasks.length ? colTasks.map(renderBoardCard).join('') : '<div class="kanban-empty">No post tasks here.</div>'}
            </div>
          </section>
        `;
      }).join('')}
    </div>
  `;
}

function renderBoardCard(task) {
  const date = task.date ? new Date(task.date + 'T12:00:00').toLocaleDateString() : 'Unscheduled';
  const next = boardNextActions(task.status, task.key);
  return `
    <article class="kanban-card" draggable="true" ondragstart="dragBoardTask(event,'${task.key}')" ondragend="this.classList.remove('dragging')" onclick="openBoardTask('${task.key}')">
      <div class="kanban-card-title">${esc(task.text || 'Untitled post')}</div>
      <div class="kanban-card-meta">
        <span class="kanban-pill kanban-platform" style="background:${boardPlatformColor(task.platform)}">${esc(task.platform)}</span>
        <span class="kanban-pill">${esc(task.campaign)}</span>
        <span class="kanban-pill">${date}</span>
      </div>
      <div class="kanban-card-actions" onclick="event.stopPropagation()">${next}</div>
    </article>
  `;
}

function boardNextActions(status, key) {
  if (status === 'draft') return `<button onclick="updateBoardTaskStatus('${key}','needs_approval')">Review</button><button onclick="updateBoardTaskStatus('${key}','scheduled')">Schedule</button>`;
  if (status === 'needs_approval') return `<button onclick="updateBoardTaskStatus('${key}','approved')">Approve</button><button onclick="updateBoardTaskStatus('${key}','failed')">Block</button>`;
  if (status === 'approved') return `<button onclick="updateBoardTaskStatus('${key}','scheduled')">Schedule</button>`;
  if (status === 'scheduled') return `<button onclick="updateBoardTaskStatus('${key}','published')">Published</button><button onclick="updateBoardTaskStatus('${key}','failed')">Failed</button>`;
  if (status === 'failed') return `<button onclick="updateBoardTaskStatus('${key}','draft')">Reopen</button>`;
  return '<button onclick="copyBoardTask(this)">Copy</button>';
}

function dragBoardTask(e, key) {
  boardDragKey = key;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function dropBoardTask(e, status, column) {
  e.preventDefault();
  column.classList.remove('board-drop-active');
  if (!boardDragKey) return;
  updateBoardTaskStatus(boardDragKey, status);
  boardDragKey = null;
}

function updateBoardTaskStatus(key, status) {
  const [source, id] = key.split(':');
  if (source === 'calendar') {
    const posts = getCalendarPosts();
    const post = posts.find(p => p.id === id);
    if (post) {
      post.status = boardStatusLabel(status);
      saveCalendarPosts(posts);
    }
  } else if (source === 'content') {
    const content = getContent();
    const item = content.find(c => c.id === id);
    if (item) {
      item.status = boardStatusLabel(status);
      saveContent(content);
    }
  }
  renderPostBoard();
}

function openBoardTask(key) {
  const task = getPostTasks().find(t => t.key === key);
  if (!task) return;
  openModal(`
    <h3>Post Task</h3>
    <div class="form-group"><label>Platform</label><input value="${esc(task.platform)}" disabled></div>
    <div class="form-group"><label>Campaign</label><input value="${esc(task.campaign)}" disabled></div>
    <div class="form-group"><label>Status</label>
      <select id="boardTaskStatus">
        ${boardColumns.map(c => `<option value="${c.id}" ${c.id === task.status ? 'selected' : ''}>${c.label}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Post Copy</label><textarea id="boardTaskText" rows="5">${esc(task.text)}</textarea></div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBoardTask('${key}')">Save</button>
    </div>
  `);
}

function saveBoardTask(key) {
  const [source, id] = key.split(':');
  const text = document.getElementById('boardTaskText').value.trim();
  const status = boardStatusLabel(document.getElementById('boardTaskStatus').value);
  if (source === 'calendar') {
    const posts = getCalendarPosts();
    const post = posts.find(p => p.id === id);
    if (post) { post.text = text; post.status = status; saveCalendarPosts(posts); }
  } else {
    const content = getContent();
    const item = content.find(c => c.id === id);
    if (item) { item.text = text; item.status = status; saveContent(content); }
  }
  closeModal();
  renderPostBoard();
}

function copyBoardTask(button) {
  const card = button.closest('.kanban-card');
  const text = card?.querySelector('.kanban-card-title')?.textContent || '';
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
}

function seedBoardFromContent() {
  const content = getContent().filter(c => c.type === 'Social Post');
  if (!content.length) return showToast('No social drafts to convert');
  showToast('Social drafts are already shown as board tasks');
}

/* ── AI Agent Chat ── */
let chatStreaming = false;

function renderAgent() {
  const el = document.getElementById('viewContent');
  el.style.padding = '0';
  el.style.display = 'flex';
  el.style.flexDirection = 'column';
  const key = getApiKey();
  const chatId = currentCampaignId || 'general';
  const history = getChatHistory(chatId);
  const campaigns = getCampaigns();
  const selector = campaigns.length ? `<select id="chatCampaignSel" onchange="currentCampaignId=this.value||null;renderAgent()" style="font-size:.75rem;padding:.3rem .5rem;border:1px solid var(--line);border-radius:6px;outline:none">
    <option value="">General</option>
    ${campaigns.map(c => `<option value="${c.id}" ${c.id === currentCampaignId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
  </select>` : '';
  const tb = document.getElementById('topbarActions');
  tb.innerHTML = selector + `<button class="btn btn-ghost" onclick="if(confirm('Clear chat history?')){saveChatHistory('${chatId}',[]);renderAgent()}">Clear</button>`;

  el.innerHTML = `
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessages">
        ${!key ? '<div class="chat-empty">Set your OpenAI API key in <a href="#" onclick="switchView(\'settings\');return false" style="color:var(--accent);font-weight:600">Settings</a> to start chatting with the AI marketing agent.</div>' :
          !history.length ? '<div class="chat-empty">Start a conversation with your AI marketing strategist.<br>Ask about campaign ideas, social media copy, email sequences, or content strategies.</div>' :
          history.map(m => renderChatMessage(m)).join('')}
      </div>
      <div class="chat-input-row">
        <input id="chatInput" placeholder="${key ? 'Ask your marketing agent...' : 'API key required'}" ${key ? '' : 'disabled'} onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}">
        <button class="chat-send" id="chatSendBtn" onclick="sendChat()" ${key ? '' : 'disabled'}>Send</button>
      </div>
    </div>
  `;
  const msgs = document.getElementById('chatMessages');
  msgs.scrollTop = msgs.scrollHeight;
  // restore padding when leaving
  el._cleanup = () => { el.style.padding = '1.2rem'; el.style.display = ''; el.style.flexDirection = ''; };
}

function renderChatMessage(m) {
  let extra = '';
  if (m.role === 'assistant' && m.content) {
    // Detect social posts
    const postMatch = m.content.match(/(?:post|tweet|caption|copy)[\s\S]*?[""](.+?)[""]/gi);
    if (postMatch) {
      const platforms = ['X', 'Instagram', 'LinkedIn', 'TikTok'];
      extra += postMatch.slice(0, 3).map((p, i) => {
        const text = p.replace(/.*?[""]/, '').replace(/[""].*/, '');
        const plat = platforms[i % platforms.length];
        return `<div class="preview-card"><div class="platform-tag" style="color:${platformColor(plat)}">${plat}</div><div style="font-size:.8rem;line-height:1.5">${esc(text)}</div></div>`;
      }).join('');
    }
    // Detect schedule suggestions
    if (/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|schedule|posting|weekly)\b/i.test(m.content) && /\b(am|pm|morning|afternoon|evening|\d{1,2}:\d{2})\b/i.test(m.content)) {
      extra += `<div class="preview-card" style="margin-top:.5rem"><div class="platform-tag" style="color:var(--accent)">Suggested Schedule</div><div style="font-size:.75rem;color:var(--muted)">The agent suggested a posting schedule above. Add posts to your Calendar to put it into action.</div></div>`;
    }
  }
  return `<div class="chat-msg ${m.role}"><div class="chat-bubble">${formatChat(m.content)}${extra}</div></div>`;
}

function platformColor(p) {
  return { X: '#1d9bf0', Instagram: '#e1306c', LinkedIn: '#0a66c2', Email: '#16a34a', TikTok: '#1a1a1a' }[p] || '#6b7280';
}

function formatChat(text) {
  if (!text) return '';
  return esc(text).replace(/\n/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code style="background:#f3f4f6;padding:.1rem .3rem;border-radius:3px;font-size:.8em">$1</code>');
}

async function sendChat() {
  if (chatStreaming) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const key = getApiKey();
  if (!key) return;

  const chatId = currentCampaignId || 'general';
  const history = getChatHistory(chatId);
  history.push({ role: 'user', content: text });
  saveChatHistory(chatId, history);

  input.value = '';
  const msgs = document.getElementById('chatMessages');
  msgs.innerHTML = history.map(m => renderChatMessage(m)).join('');
  // Add typing indicator
  msgs.innerHTML += '<div class="chat-msg assistant" id="typingMsg"><div class="chat-bubble" style="color:var(--muted)">Thinking...</div></div>';
  msgs.scrollTop = msgs.scrollHeight;

  chatStreaming = true;
  document.getElementById('chatSendBtn').disabled = true;

  const camp = currentCampaignId ? getCampaigns().find(c => c.id === currentCampaignId) : null;
  const systemMsg = `You are an expert marketing strategist. Help the user plan campaigns, write social media posts, email sequences, ad copy, and content strategies. Be specific with actionable tactics, suggested copy, and posting schedules.${camp ? `\n\nCurrent campaign: "${camp.name}"\nGoal: ${camp.goal}\nAudience: ${camp.audience}\nChannels: ${camp.channels.join(', ')}\nStatus: ${camp.status}` : ''}`;

  const apiMessages = [{ role: 'system', content: systemMsg }, ...history.map(m => ({ role: m.role, content: m.content }))];

  try {
    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'gpt-4o-mini', messages: apiMessages, max_tokens: 1500 })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || 'API error ' + resp.status);
    }
    const data = await resp.json();
    const reply = data.choices?.[0]?.message?.content || 'No response.';
    history.push({ role: 'assistant', content: reply });
    saveChatHistory(chatId, history);

    // Auto-save content pieces from AI
    autoSaveContent(reply, camp);
  } catch (err) {
    history.push({ role: 'assistant', content: 'Error: ' + err.message });
    saveChatHistory(chatId, history);
  }

  chatStreaming = false;
  document.getElementById('chatSendBtn').disabled = false;
  msgs.innerHTML = history.map(m => renderChatMessage(m)).join('');
  msgs.scrollTop = msgs.scrollHeight;
}

function autoSaveContent(text, camp) {
  // If the AI generated content that looks like social posts or emails, auto-save
  const lines = text.split('\n');
  let found = false;
  for (const line of lines) {
    if (line.match(/^(post|tweet|caption|subject line|email body|headline|ad copy|blog title)/i) && line.length > 30) {
      found = true;
    }
  }
  // Simple heuristic: if text contains quoted content, save the whole response as a content piece
  if (text.match(/[""].{20,}[""]/)) {
    const content = getContent();
    const type = text.match(/email/i) ? 'Email' : text.match(/blog/i) ? 'Blog Outline' : text.match(/ad/i) ? 'Ad Copy' : 'Social Post';
    content.unshift({ id: 'ct_' + Date.now(), type, text: text.slice(0, 500), campaignId: camp?.id || null, campaign: camp?.name || 'General', status: 'Draft', created: new Date().toISOString() });
    saveContent(content);
  }
}

/* ── Calendar View ── */
function renderCalendar() {
  const now = new Date();
  if (calMonth === undefined) { calMonth = now.getMonth(); calYear = now.getFullYear(); }
  const el = document.getElementById('viewContent');
  const tb = document.getElementById('topbarActions');
  tb.innerHTML = '<button class="btn btn-primary" onclick="openAddPostModal()">+ Add Post</button>';

  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth + 1, 0);
  const startPad = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const today = now.getDate();
  const isThisMonth = calMonth === now.getMonth() && calYear === now.getFullYear();
  const posts = getCalendarPosts();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let cells = '';
  // Previous month padding
  const prevLast = new Date(calYear, calMonth, 0).getDate();
  for (let i = startPad - 1; i >= 0; i--) {
    cells += `<div class="cal-day other"><div class="cal-day-num">${prevLast - i}</div></div>`;
  }
  // Current month
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayPosts = posts.filter(p => p.date === dateStr);
    const cls = (isThisMonth && d === today) ? ' today' : '';
    cells += `<div class="cal-day${cls}" onclick="showDayDetail('${dateStr}')" data-date="${dateStr}" ondragover="event.preventDefault()" ondrop="dropPost(event,'${dateStr}')">
      <div class="cal-day-num">${d}</div>
      ${dayPosts.map(p => `<div class="cal-dot" data-platform="${p.platform}" draggable="true" ondragstart="dragPost(event,'${p.id}')" title="${esc(p.text)}">${esc(p.text.slice(0, 18))}</div>`).join('')}
    </div>`;
  }
  // Next month padding
  const totalCells = startPad + totalDays;
  const remaining = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= remaining; i++) {
    cells += `<div class="cal-day other"><div class="cal-day-num">${i}</div></div>`;
  }

  el.innerHTML = `
    <div class="cal-header">
      <h3>${monthNames[calMonth]} ${calYear}</h3>
      <div class="cal-nav">
        <button onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCalendar()">&larr;</button>
        <button onclick="calMonth=${now.getMonth()};calYear=${now.getFullYear()};renderCalendar()">Today</button>
        <button onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCalendar()">&rarr;</button>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-day-header">Sun</div><div class="cal-day-header">Mon</div><div class="cal-day-header">Tue</div><div class="cal-day-header">Wed</div><div class="cal-day-header">Thu</div><div class="cal-day-header">Fri</div><div class="cal-day-header">Sat</div>
      ${cells}
    </div>
    <div id="dayDetail"></div>
  `;
}

let dragPostId = null;

  const posts = getCalendarPosts();

}

function drawEngagementChart() {
  const canvas = document.getElementById('engagementChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 200 * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '200px';
  ctx.scale(dpr, dpr);

  const w = rect.width, h = 200;
  const pad = { top: 20, right: 20, bottom: 30, left: 45 };
  const pw = w - pad.left - pad.right, ph = h - pad.top - pad.bottom;

  // Generate random-looking but smooth data
  const seed = 42;
  const points = 30;
  const data = [];
  let v = 2.5;
  for (let i = 0; i < points; i++) {
    v += (Math.sin(i * 0.7 + seed) * 0.3 + Math.cos(i * 1.3) * 0.2);
    v = Math.max(0.5, Math.min(5.5, v));
    data.push(v);
  }
  const maxV = Math.max(...data) * 1.1;
  const minV = Math.min(...data) * 0.9;

  // Grid
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ph / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#9ca3af'; ctx.font = '10px Manrope,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(((maxV - (maxV - minV) * i / 4)).toFixed(1) + '%', pad.left - 5, y + 3);
  }

  // Labels
  const days = ['Jun 1', '', '', '', 'Jun 5', '', '', '', '', 'Jun 10', '', '', '', '', 'Jun 15', '', '', '', '', 'Jun 20', '', '', '', '', 'Jun 25', '', '', '', '', 'Jun 30'];
  ctx.fillStyle = '#9ca3af'; ctx.font = '9px Manrope,sans-serif'; ctx.textAlign = 'center';
  for (let i = 0; i < points; i++) {
    if (days[i]) ctx.fillText(days[i], pad.left + (pw / (points - 1)) * i, h - 8);
  }

  // Gradient fill
  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ph);
  grad.addColorStop(0, 'rgba(249,115,22,0.15)');
  grad.addColorStop(1, 'rgba(249,115,22,0)');
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top + ph);
  for (let i = 0; i < points; i++) {
    const x = pad.left + (pw / (points - 1)) * i;
    const y = pad.top + ph - ((data[i] - minV) / (maxV - minV)) * ph;
    if (i === 0) ctx.lineTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.lineTo(pad.left + pw, pad.top + ph);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  const lineGrad = ctx.createLinearGradient(pad.left, 0, w - pad.right, 0);
  lineGrad.addColorStop(0, '#f97316');
  lineGrad.addColorStop(1, '#ef4444');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < points; i++) {
    const x = pad.left + (pw / (points - 1)) * i;
    const y = pad.top + ph - ((data[i] - minV) / (maxV - minV)) * ph;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Dots
  for (let i = 0; i < points; i++) {
    const x = pad.left + (pw / (points - 1)) * i;
    const y = pad.top + ph - ((data[i] - minV) / (maxV - minV)) * ph;
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#f97316'; ctx.fill();
  }
}

/* ── Modal & Toast ── */
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, { position: 'fixed', bottom: '1.2rem', right: '1.2rem', background: 'var(--text)', color: '#fff', padding: '.5rem 1rem', borderRadius: '8px', fontSize: '.82rem', fontWeight: '600', zIndex: '200', animation: 'fadeIn .2s', fontFamily: 'Manrope,sans-serif' });
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2000);
}

/* ── Utils ── */
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ── Cleanup on view switch ── */
const origSwitch = switchView;
window.switchView = function(view, opts) {
  const el = document.getElementById('viewContent');
  if (el._cleanup) { el._cleanup(); el._cleanup = null; }
  origSwitch(view, opts);
};

/* ── API Client ── */
const API_BASE = location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://promarketingstore-backend.serge-the-dev.workers.dev';
function getToken() { return localStorage.getItem('pms_token'); }
function setToken(t) { if (t) localStorage.setItem('pms_token', t); else localStorage.removeItem('pms_token'); }
function getUser() { return LS('user'); }
function setUser(u) { SS('user', u); }

async function api(path, opts = {}) {
  const token = getToken();
  const headers = { ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData) && !(opts.body instanceof ArrayBuffer)) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(API_BASE + '/v1' + path, { ...opts, headers });
  if (res.status === 401) { setToken(null); setUser(null); renderAuthBar(); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'API error ' + res.status);
  return data;
}

function renderAuthBar() {
  const footer = document.querySelector('.sidebar-footer');
  const user = getUser();
  if (user) {
    footer.innerHTML = `<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem"><div style="width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;flex-shrink:0">${esc((user.name || user.email || '?')[0].toUpperCase())}</div><div><div style="font-size:.78rem;font-weight:600">${esc(user.name || 'User')}</div><div style="font-size:.65rem;color:var(--muted)">${esc(user.email)}</div></div></div><button class="btn btn-secondary" style="width:100%;font-size:.72rem" onclick="signOut()">Sign Out</button>`;
  } else {
    footer.innerHTML = `<button class="btn btn-primary" style="width:100%;font-size:.78rem" onclick="signIn()">Sign In with Google</button>`;
  }
}

async function signIn() {
  const GOOGLE_CLIENT_ID = ''; // Set via settings or env
  if (!GOOGLE_CLIENT_ID) { showToast('Google Client ID not configured — set in Settings'); switchView('settings'); return; }
  // In a real implementation, use Google Identity Services or redirect flow
  showToast('Google sign-in flow — configure GOOGLE_CLIENT_ID');
}

function signOut() {
  setToken(null);
  setUser(null);
  renderAuthBar();
  showToast('Signed out');
}

/* ── Connections View ── */
async function renderConnections() {
  const el = document.getElementById('viewContent');
  document.getElementById('viewTitle').textContent = 'Connected Accounts';
  const tb = document.getElementById('topbarActions');
  tb.innerHTML = '';

  if (!getToken()) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">&#128274;</div><p>Sign in to connect your social accounts.</p></div>';
    return;
  }

  el.innerHTML = '<p style="color:var(--muted);font-size:.84rem">Loading accounts...</p>';
  try {
    const [accountsData, providersData] = await Promise.all([api('/social/accounts'), api('/social/providers')]);
    const accounts = accountsData.accounts || [];
    const providers = providersData.providers || [];

    let html = '<div style="margin-bottom:1.2rem"><h3 style="font-size:.9rem;font-weight:700;margin-bottom:.6rem">Connect a Platform</h3><div style="display:flex;gap:.5rem;flex-wrap:wrap">';
    for (const p of providers) {
      if (p.status === 'oauth-ready' || p.status === 'account-discovery-ready') {
        html += `<button class="btn btn-secondary" onclick="connectProvider('${p.id}')" style="text-transform:capitalize">${esc(p.name)}</button>`;
      }
    }
    html += '</div></div>';

    if (accounts.length) {
      html += '<h3 style="font-size:.9rem;font-weight:700;margin-bottom:.6rem">Connected Accounts</h3>';
      html += accounts.map(a => `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:.85rem;font-weight:600">${esc(a.displayName)}</div>
            <div style="font-size:.72rem;color:var(--muted);text-transform:capitalize">${a.provider} &middot; <span class="status-badge status-${a.status === 'connected' ? 'active' : 'draft'}">${a.status}</span></div>
          </div>
          <button class="btn btn-ghost" style="color:#ef4444;font-size:.75rem" onclick="disconnectAccount('${a.id}')">Disconnect</button>
        </div>
      `).join('');
    } else {
      html += '<p style="font-size:.82rem;color:var(--muted)">No accounts connected yet. Click a platform above to get started.</p>';
    }
    el.innerHTML = html;
  } catch (err) {
    el.innerHTML = `<div class="card" style="color:#ef4444">${esc(err.message)}</div>`;
  }
}

async function connectProvider(provider) {
  try {
    const endpoint = provider === 'x' ? '/social/x/oauth/start' : '/social/meta/oauth/start';
    const data = await api(endpoint, { method: 'POST', body: { returnTo: location.href } });
    if (data.authUrl) window.location.href = data.authUrl;
    else showToast('No auth URL returned');
  } catch (err) {
    showToast('Connection failed: ' + err.message);
  }
}

async function disconnectAccount(id) {
  if (!confirm('Disconnect this account?')) return;
  try {
    await api('/social/accounts/' + id, { method: 'DELETE' });
    showToast('Account disconnected');
    renderConnections();
  } catch (err) {
    showToast('Failed: ' + err.message);
  }
}

    return;
  }

  let accounts = [];
  try {
    const data = await api('/social/accounts');
    accounts = data.accounts || [];
  } catch { /* ignore */ }

  const accountOpts = accounts.length
    ? accounts.map(a => `<option value="${a.id}">${esc(a.displayName)} (${a.provider})</option>`).join('')
    : '<option value="">No accounts connected</option>';
  const platformOpts = ['facebook', 'instagram', 'x'].map(p => `<option value="${p}" style="text-transform:capitalize">${p}</option>`).join('');

  el.innerHTML = `
    <div class="card" style="max-width:640px">
      <h3 style="font-size:.9rem;font-weight:700;margin-bottom:.8rem">New Post</h3>
      <div class="form-group"><label>Platform</label><select id="compPlatform">${platformOpts}</select></div>
      <div class="form-group"><label>Social Account</label><select id="compAccount"><option value="">Select account...</option>${accountOpts}</select></div>
      <div class="form-group"><label>Content</label><textarea id="compContent" rows="4" placeholder="What do you want to post?"></textarea></div>
      <div class="form-group"><label>Schedule (optional)</label><input type="datetime-local" id="compSchedule"></div>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="composePost('draft')">Save Draft</button>
        <button class="btn btn-primary" onclick="composePost('schedule')">Schedule</button>
      </div>
      <div id="compStatus" style="margin-top:.6rem;font-size:.8rem"></div>
    </div>
  `;
}

async function composePost(action) {
  const platform = document.getElementById('compPlatform').value;
  const socialAccountId = document.getElementById('compAccount').value || undefined;
  const content = document.getElementById('compContent').value.trim();
  const scheduleEl = document.getElementById('compSchedule');
  const scheduledFor = scheduleEl.value ? new Date(scheduleEl.value).toISOString() : undefined;
  const status = document.getElementById('compStatus');

  if (!content) { status.textContent = 'Content is required.'; return; }
  if (action === 'schedule' && !scheduledFor) { status.textContent = 'Select a date/time to schedule.'; return; }

  status.textContent = 'Creating...';
  status.style.color = 'var(--muted)';
  try {
    const data = await api('/posts', { method: 'POST', body: { platform, content, socialAccountId, scheduledFor } });
    status.style.color = '#16a34a';
    status.textContent = action === 'schedule' ? 'Post scheduled!' : 'Draft saved!';
    document.getElementById('compContent').value = '';
    scheduleEl.value = '';
    showToast(action === 'schedule' ? 'Post scheduled' : 'Draft saved');
  } catch (err) {
    status.style.color = '#ef4444';
    status.textContent = err.message;
  }
}

function openAddSourceModal() {
  openModal(`
    <h3>Add Content Source</h3>
    <div class="form-group"><label>Type</label>
      <select id="srcType" onchange="updateSourceForm()">
        <option value="website">Website / Blog</option>
        <option value="rss">RSS Feed</option>
        <option value="slack">Slack Channel</option>
        <option value="teams">Teams Channel</option>
      </select>
    </div>
    <div class="form-group"><label>Name</label><input id="srcName" placeholder="My Company Blog"></div>
    <div id="srcConfigFields">
      <div class="form-group"><label>URL</label><input id="srcUrl" placeholder="https://example.com"></div>
    </div>
    <div class="form-group"><label>Scan Frequency</label>
      <select id="srcFreq">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>

      </select>
    </div>

      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>

function updateSourceForm() {
  const type = document.getElementById('srcType').value;
  const fields = document.getElementById('srcConfigFields');
  if (type === 'website' || type === 'rss') {
    fields.innerHTML = '<div class="form-group"><label>URL</label><input id="srcUrl" placeholder="https://example.com/blog"></div>';
  } else if (type === 'slack') {
    fields.innerHTML = '<div class="form-group"><label>Channel Name</label><input id="srcChannel" placeholder="#announcements"></div><p style="font-size:.72rem;color:var(--muted);margin-top:.3rem">After adding, configure a Slack webhook to POST to the URL shown.</p>';
  } else {
    fields.innerHTML = '<div class="form-group"><label>Channel Name</label><input id="srcChannel" placeholder="General"></div><p style="font-size:.72rem;color:var(--muted);margin-top:.3rem">After adding, set up a Power Automate flow to POST to the webhook URL.</p>';
  }
}

async function addSource() {
  const type = document.getElementById('srcType').value;
  const name = document.getElementById('srcName').value.trim();
  if (!name) { showToast('Name is required'); return; }

  const config = {};
  if (type === 'website' || type === 'rss') {
    const url = document.getElementById('srcUrl').value.trim();
    if (!url) { showToast('URL is required'); return; }
    config.url = url;
  } else {
    const ch = document.getElementById('srcChannel');
    if (ch) config.channel = ch.value.trim();
  }

  try {
    const data = await api('/sources', { method: 'POST', body: { type, name, config, scanFrequency: document.getElementById('srcFreq').value } });
    closeModal();
    showToast('Source added!');

    // Show webhook URL for Slack/Teams
    if ((type === 'slack' || type === 'teams') && data.source) {
      const webhookUrl = API_BASE + '/v1/webhooks/' + type + '/' + data.source.id;
      openModal(`<h3>Webhook URL</h3><p style="font-size:.82rem;margin-bottom:.5rem">Configure your ${type === 'slack' ? 'Slack' : 'Teams'} to send messages to:</p><input value="${webhookUrl}" style="width:100%;padding:.5rem;font-size:.78rem;border:1px solid var(--line);border-radius:6px;background:var(--bg)" readonly onclick="this.select()"><div class="form-actions" style="margin-top:.8rem"><button class="btn btn-primary" onclick="closeModal();renderContentSources()">Done</button></div>`);
    } else {
      renderContentSources();
    }
  } catch (err) { showToast('Failed: ' + err.message); }
}

async function scanSource(id) {
  showToast('Scanning...');
  try {
    const data = await api('/sources/' + id + '/scan', { method: 'POST' });
    showToast(`Scanned: ${data.extracted} new items, ${data.skipped} skipped`);
    renderContentSources();
  } catch (err) { showToast('Scan failed: ' + err.message); }
}

async function doGenerate(sourceId) {
  const platforms = [...document.querySelectorAll('.checkbox-group input:checked')].map(c => c.value);
  const count = parseInt(document.getElementById('genCount').value, 10) || 5;
  const tone = document.getElementById('genTone').value;
  const status = document.getElementById('genStatus');
  if (!platforms.length) { status.textContent = 'Select at least one platform'; return; }

  status.textContent = 'Generating posts with AI...';
  status.style.color = 'var(--muted)';
  try {
    const data = await api('/sources/' + sourceId + '/generate', { method: 'POST', body: { platforms, count, tone } });
    status.style.color = '#16a34a';
    status.textContent = `Generated ${data.generated} draft posts!`;
    showToast(`${data.generated} posts generated — check Post History`);
    setTimeout(() => { closeModal(); switchView('postHistory'); }, 1500);
  } catch (err) {
    status.style.color = '#ef4444';
    status.textContent = err.message;
  }
}

async function deleteSource(id) {

  try {
    await api('/sources/' + id, { method: 'DELETE' });
    showToast('Source removed');
    renderContentSources();
  } catch (err) { showToast('Failed: ' + err.message); }
}

          <div class="form-group"><label>Paste 2-3 posts that match your desired voice</label><textarea id="bvExamples" rows="4" placeholder="One post per line...">${(voice.examples || []).join('\\n')}</textarea></div>
        </div>

        <div class="card" style="margin-bottom:.8rem">
          <h3 style="font-size:.9rem;font-weight:700;margin-bottom:.6rem">Guardrails</h3>
          <div class="form-group"><label>Topics / Terms to Avoid (comma separated)</label><input id="bvBlocked" value="${(brand.blockedTerms || []).join(', ')}" placeholder="e.g. politics, competitors, profanity"></div>
        </div>

        <div class="card" style="margin-bottom:.8rem">
          <h3 style="font-size:.9rem;font-weight:700;margin-bottom:.6rem">Automation</h3>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;text-transform:none;letter-spacing:0">
              <input type="checkbox" id="bvAutoApprove" ${rules.autoApprove ? 'checked' : ''} style="accent-color:var(--accent)">
              Auto-approve AI-generated posts (skip manual review)
            </label>
          </div>
          <div class="form-group"><label>Posts per Day (for auto-schedule)</label><input type="number" id="bvPostsPerDay" value="${rules.postsPerDay || 3}" min="1" max="10"></div>
        </div>

        <button class="btn btn-primary" onclick="saveBrandVoice()">Save Brand Voice</button>
        <span id="bvStatus" style="margin-left:.5rem;font-size:.8rem"></span>
      </div>
    `;
  } catch (err) {
    el.innerHTML = `<div class="card" style="color:#ef4444">${esc(err.message)}</div>`;
  }
}

async function saveBrandVoice() {
  const status = document.getElementById('bvStatus');
  status.textContent = 'Saving...';
  status.style.color = 'var(--muted)';
  try {
    await api('/brand', { method: 'PATCH', body: {
      name: document.getElementById('bvName').value.trim(),
      voice: {
        tone: document.getElementById('bvTone').value,
        style: document.getElementById('bvStyle').value.trim(),
        examples: document.getElementById('bvExamples').value.split('\n').filter(l => l.trim()),
      },
      audience: { description: document.getElementById('bvAudience').value.trim() },
      blockedTerms: document.getElementById('bvBlocked').value.split(',').map(t => t.trim()).filter(Boolean),
      approvalRules: {
        autoApprove: document.getElementById('bvAutoApprove').checked,
        postsPerDay: parseInt(document.getElementById('bvPostsPerDay').value, 10) || 3,
      },
    }});
    status.style.color = '#16a34a';
    status.textContent = 'Saved!';
    showToast('Brand voice updated');
  } catch (err) {
    status.style.color = '#ef4444';
    status.textContent = err.message;
  }
}

/* ── Dashboard View ── */
async function renderDashboard() {
  const el = document.getElementById('viewContent');
  document.getElementById('viewTitle').textContent = 'Dashboard';
  document.getElementById('topbarActions').innerHTML = '';

  if (!getToken()) {
    // Unauthenticated: show the hero onboarding
    el.innerHTML = `
      <div style="text-align:center;padding:2rem 1rem">
        <h1 style="font-size:1.4rem;font-weight:800;margin-bottom:.5rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Turn your content into social posts</h1>
        <p style="font-size:.9rem;color:var(--muted);margin-bottom:1.5rem;max-width:500px;margin-left:auto;margin-right:auto">Paste your website URL. AI reads your content and generates ready-to-post social media updates for X, Facebook, and Instagram.</p>
        <div style="max-width:480px;margin:0 auto">
          <div style="display:flex;gap:.5rem;margin-bottom:.5rem">
            <input id="heroUrl" placeholder="https://your-website.com" style="flex:1;padding:.6rem .8rem;border:1px solid var(--line);border-radius:8px;font-size:.88rem;outline:none" onkeydown="if(event.key==='Enter')heroOnboard()">
            <button class="btn btn-primary" style="padding:.6rem 1.2rem;font-size:.88rem" onclick="heroOnboard()">Generate Posts</button>
          </div>
          <p style="font-size:.72rem;color:var(--muted)">Sign in first, then paste your URL. Uses your own OpenAI or Anthropic key.</p>
        </div>
      </div>
    `;
    return;
  }

  el.innerHTML = '<p style="color:var(--muted);font-size:.84rem">Loading...</p>';
  try {
    const data = await api('/dashboard');

    // Quick-start bar (always visible)
    let html = `
      <div class="card" style="margin-bottom:1rem;padding:1rem">
        <div style="display:flex;gap:.5rem;align-items:center">
          <input id="quickUrl" placeholder="Paste a URL to generate social posts..." style="flex:1;padding:.5rem .7rem;border:1px solid var(--line);border-radius:7px;font-size:.84rem;outline:none" onkeydown="if(event.key==='Enter')quickOnboard()">
          <button class="btn btn-primary" onclick="quickOnboard()">Generate</button>
        </div>
        <div id="quickStatus" style="margin-top:.4rem;font-size:.78rem"></div>
      </div>
    `;

    // Stats
    html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1.2rem">
      <div class="card" style="text-align:center"><div style="font-size:1.8rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${data.connectedAccounts}</div><div style="font-size:.75rem;color:var(--muted);font-weight:600;margin-top:.2rem">Connected Accounts</div></div>
      <div class="card" style="text-align:center"><div style="font-size:1.8rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${data.totalPosts}</div><div style="font-size:.75rem;color:var(--muted);font-weight:600;margin-top:.2rem">Total Posts</div></div>
      <div class="card" style="text-align:center"><div style="font-size:1.8rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${data.scheduledPosts}</div><div style="font-size:.75rem;color:var(--muted);font-weight:600;margin-top:.2rem">Scheduled</div></div>
    </div>`;

    // Setup checklist
    if (data.connectedAccounts === 0 || data.totalPosts === 0) {
      html += '<div class="card" style="margin-bottom:1rem"><h3 style="font-size:.88rem;font-weight:700;margin-bottom:.5rem">Quick Setup</h3>';
      const steps = [
        { done: true, text: 'Create account', action: '' },
        { done: data.connectedAccounts > 0, text: 'Connect a social account', action: "switchView('connections')" },
        { done: false, text: 'Add your AI key (OpenAI or Anthropic)', action: "switchView('settings')" },
        { done: data.totalPosts > 0, text: 'Generate your first posts', action: "document.getElementById('quickUrl').focus()" },
      ];
      html += steps.map(s => `<div style="display:flex;align-items:center;gap:.5rem;padding:.3rem 0;font-size:.82rem${s.done ? ';color:var(--muted);text-decoration:line-through' : ''}"><span>${s.done ? '&#9989;' : '&#9744;'}</span><span style="flex:1">${s.text}</span>${!s.done && s.action ? `<button class="btn btn-secondary" style="font-size:.72rem" onclick="${s.action}">Do it</button>` : ''}</div>`).join('');
      html += '</div>';
    }

    // Recent activity
    html += '<h3 style="font-size:.9rem;font-weight:700;margin-bottom:.6rem">Recent Activity</h3>';
    if (data.recentPosts.length) {
      html += data.recentPosts.map(p => `
        <div class="card" style="display:flex;align-items:center;gap:.8rem">
          <span style="font-size:.68rem;padding:.15rem .5rem;border-radius:4px;background:#f3f4f6;font-weight:700;text-transform:capitalize;flex-shrink:0">${esc(p.platform)}</span>
          <div style="flex:1;min-width:0"><div style="font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.content)}</div><div style="font-size:.68rem;color:var(--muted)">${p.postedAt ? 'Posted ' + new Date(p.postedAt).toLocaleString() : p.scheduledFor ? 'Scheduled ' + new Date(p.scheduledFor).toLocaleString() : 'Draft'}</div></div>
          <span class="status-badge status-${p.status === 'posted' ? 'posted' : p.status === 'scheduled' ? 'scheduled' : 'draft'}">${p.status}</span>
        </div>
      `).join('');
    } else {
      html += '<p style="font-size:.82rem;color:var(--muted)">No posts yet. Paste a URL above to get started!</p>';
    }
    el.innerHTML = html;
  } catch (err) {
    el.innerHTML = `<div class="card" style="color:#ef4444">${esc(err.message)}</div>`;
  }
}

async function heroOnboard() { showToast('Sign in first to generate posts'); }

async function quickOnboard() {
  const input = document.getElementById('quickUrl');
  const status = document.getElementById('quickStatus');
  const url = input.value.trim();
  if (!url) { status.textContent = 'Paste a URL first'; return; }

  status.textContent = 'Scanning your content and generating posts...';
  status.style.color = 'var(--muted)';
  try {
    const data = await api('/onboard', { method: 'POST', body: { url, platforms: ['x', 'facebook'], count: 5 } });

    if (data.error && !data.posts?.length) {
      status.style.color = '#ef4444';
      status.textContent = data.error + (data.hint ? ' ' + data.hint : '');
      return;
    }

    if (data.posts?.length) {
      status.style.color = '#16a34a';
      status.textContent = `Generated ${data.generated} posts! Opening Post History...`;
      showToast(`${data.generated} draft posts generated from ${url}`);
      setTimeout(() => switchView('postHistory'), 1000);
    } else {
      status.style.color = '#f59e0b';
      status.textContent = data.message || 'No content found. Try a blog or about page URL.';
    }
  } catch (err) {
    status.style.color = '#ef4444';
    status.textContent = err.message;
  }
}

/* ── Post Calendar View ── */
let pcMonth, pcYear;

async function renderPostCalendar() {
  const el = document.getElementById('viewContent');
  document.getElementById('viewTitle').textContent = 'Content Calendar';
  document.getElementById('topbarActions').innerHTML = '<button class="btn btn-primary" onclick="switchView(\'compose\')">+ New Post</button>';

  if (!getToken()) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">&#128197;</div><p>Sign in to see your calendar.</p></div>';
    return;
  }

  const now = new Date();
  if (!pcMonth) { pcMonth = now.getMonth() + 1; pcYear = now.getFullYear(); }

  const monthStr = `${pcYear}-${String(pcMonth).padStart(2, '0')}`;
  el.innerHTML = '<p style="color:var(--muted);font-size:.84rem">Loading...</p>';

  try {
    const data = await api('/posts/calendar?month=' + monthStr);
    const posts = data.posts || [];

    // Group posts by day
    const byDay = {};
    for (const p of posts) {
      const day = p.date ? new Date(p.date).getDate() : 1;
      if (!byDay[day]) byDay[day] = [];
      byDay[day].push(p);
    }

    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const firstDay = new Date(pcYear, pcMonth - 1, 1).getDay();
    const daysInMonth = new Date(pcYear, pcMonth, 0).getDate();

    let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem">
      <button class="btn btn-ghost" onclick="pcMonth--;if(pcMonth<1){pcMonth=12;pcYear--;}renderPostCalendar()">&larr;</button>
      <h3 style="font-size:1rem;font-weight:700">${monthNames[pcMonth - 1]} ${pcYear}</h3>
      <button class="btn btn-ghost" onclick="pcMonth++;if(pcMonth>12){pcMonth=1;pcYear++;}renderPostCalendar()">&rarr;</button>
    </div>`;

    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.72rem">';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
      html += `<div style="text-align:center;font-weight:700;color:var(--muted);padding:.3rem">${d}</div>`;
    });

    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) html += '<div></div>';

    for (let d = 1; d <= daysInMonth; d++) {
      const dayPosts = byDay[d] || [];
      const isToday = d === now.getDate() && pcMonth === now.getMonth() + 1 && pcYear === now.getFullYear();
      html += `<div style="min-height:70px;border:1px solid var(--line);border-radius:6px;padding:.25rem;${isToday ? 'background:rgba(249,115,22,.05);border-color:var(--accent)' : ''}">
        <div style="font-size:.7rem;font-weight:${isToday ? '800' : '600'};color:${isToday ? 'var(--accent)' : 'var(--muted)'};margin-bottom:.15rem">${d}</div>
        ${dayPosts.slice(0, 3).map(p => {
          const colors = { facebook: '#1877f2', instagram: '#e4405f', x: '#1da1f2' };
          const bg = colors[p.platform] || '#6b7280';
          return `<div style="font-size:.6rem;padding:.1rem .3rem;border-radius:3px;background:${bg};color:#fff;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(p.content)}">${esc(p.content.slice(0, 20))}</div>`;
        }).join('')}
        ${dayPosts.length > 3 ? `<div style="font-size:.55rem;color:var(--muted)">+${dayPosts.length - 3} more</div>` : ''}
      </div>`;
    }
    html += '</div>';
    el.innerHTML = html;
  } catch (err) {
    el.innerHTML = `<div class="card" style="color:#ef4444">${esc(err.message)}</div>`;
  }
}

/* ── Batch Schedule ── */
async function batchScheduleDrafts() {
  if (!getToken()) { showToast('Sign in first'); return; }

  let accounts = [];
  try {
    const data = await api('/social/accounts');
    accounts = (data.accounts || []).filter(a => a.status === 'connected');
  } catch { /* ignore */ }

  if (!accounts.length) { showToast('Connect a social account first'); switchView('connections'); return; }

  // Get draft posts
  let drafts = [];
  try {
    const data = await api('/posts?status=draft');
    drafts = data.posts || [];
  } catch { /* ignore */ }

  if (!drafts.length) { showToast('No draft posts to schedule'); return; }

  const accountOpts = accounts.map(a => `<option value="${a.id}">${esc(a.displayName)} (${a.provider})</option>`).join('');

  openModal(`
    <h3>Schedule ${drafts.length} Draft Posts</h3>
    <p style="font-size:.82rem;color:var(--muted);margin-bottom:.8rem">Auto-schedule draft posts at optimal times across multiple days.</p>
    <div class="form-group"><label>Social Account</label><select id="bsAccount">${accountOpts}</select></div>
    <div class="form-group"><label>Start Date</label><input type="date" id="bsStart" value="${new Date(Date.now() + 86400000).toISOString().slice(0, 10)}"></div>
    <div class="form-group"><label>Posts per Day</label><input type="number" id="bsPerDay" value="3" min="1" max="10"></div>
    <p style="font-size:.72rem;color:var(--muted)">Posts will be spread across ${Math.ceil(drafts.length / 3)} days at 9am, 12:30pm, and 5pm UTC.</p>
    <div id="bsStatus" style="margin-top:.5rem;font-size:.8rem"></div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="doBatchSchedule(${JSON.stringify(drafts.map(d => d.id)).replace(/"/g, '&quot;')})">Schedule All</button>
    </div>
  `);
}

async function doBatchSchedule(postIds) {
  const status = document.getElementById('bsStatus');
  status.textContent = 'Scheduling...';
  status.style.color = 'var(--muted)';
  try {
    const data = await api('/posts/batch-schedule', { method: 'POST', body: {
      postIds,
      socialAccountId: document.getElementById('bsAccount').value,
      startDate: document.getElementById('bsStart').value + 'T09:00:00Z',
      postsPerDay: parseInt(document.getElementById('bsPerDay').value, 10) || 3,
    }});
    status.style.color = '#16a34a';
    status.textContent = `Scheduled ${data.scheduled} posts across ${data.totalDays} days!`;
    showToast(`${data.scheduled} posts scheduled`);
    setTimeout(() => { closeModal(); renderPostHistory(); }, 1500);
  } catch (err) {
    status.style.color = '#ef4444';
    status.textContent = err.message;
  }
}
